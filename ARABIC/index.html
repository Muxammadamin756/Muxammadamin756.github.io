<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arab Tili O'rganish</title>

    <link rel="stylesheet" href="./Boshindex/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-container p {
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .login-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .main-btn {
            grid-column: 1 / -1;
            padding: 15px 50px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .docs-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .docs-btn:hover {
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
        }

        .settings-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .settings-btn:hover {
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        .help-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .help-btn:hover {
            box-shadow: 0 10px 20px rgba(67, 233, 123, 0.4);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-icon">
            ا
        </div>
        <h1>Arab Tili O'rganish</h1>
        <p>Zamonaviy arab tili dardagi - Alfavit, so'zlar, qoidalar va mashqlar</p>
        
        <div class="button-group">
            <a href="./Boshindex.html/index.html" class="login-btn main-btn">📚 Darslar</a>
            
            <a href="./OVoz/" class="login-btn docs-btn">🔊 Ovozlar</a>
            
            <a href="./style/" class="login-btn settings-btn">⚙️ Uslublar</a>
            
            <a href="./views/" class="login-btn help-btn">👁️ Ko'rinishlar</a>
        </div>

        <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">

        <div class="button-group" style="grid-template-columns: 1fr;">
            <a href="./README.md" class="login-btn" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">📄 README</a>
            <a href="./package.json" class="login-btn" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">⚙️ Package</a>
        </div>
    </div>

</body>

</html>
